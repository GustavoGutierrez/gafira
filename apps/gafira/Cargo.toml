[package]
name = "gafira"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gafira-ui.workspace = true
gafira-engine.workspace = true
gafira-platform.workspace = true
gafira-format.workspace = true
gafira-assets.workspace = true
gafira-i18n.workspace = true
gafira-ports.workspace = true
gafira-render.workspace = true
gafira-render-cpu.workspace = true
gafira-theme.workspace = true
gafira-io-image.workspace = true
gafira-io-pdf.workspace = true
gafira-io-svg.workspace = true
gafira-io-pptx.workspace = true
gafira-io-xlsx.workspace = true
gafira-io-model3d.workspace = true
# D-111: Elementos → Fotos, the only network besides the licence.
gafira-photos = { workspace = true, features = ["online"] }
gafira-vision = { workspace = true, features = ["online", "onnx"] }
eframe.workspace = true
# Spec 074: the export settings kept per format, as JSON.
serde_json.workspace = true
# Spec 094: the .gafkit package of a brand kit is a ZIP.
zip.workspace = true

[dev-dependencies]
# Spec 097: the test packages carry a WebP thumbnail and a PNG.
image.workspace = true
# Spec 112: the test packages are signed with a test key.
ed25519-dalek.workspace = true
# Spec 091: `examples/make_templates.rs` builds and draws the templates.
gafira-doc.workspace = true
gafira-geom.workspace = true
gafira-time.workspace = true

[build-dependencies]
# Spec 090: the icon and the details of the Windows executable.
winresource.workspace = true

[lints]
workspace = true
