# cargo-mutants settings. Keep minimal; see AGENTS.md "Rules" (Testing).
additional_cargo_test_args = ["--locked"]
# Cargo profile from Cargo.toml [profile.mutants] (inherits test, no debug info) to cut build time per mutant.
profile = "mutants"

# Equivalent mutants (AGENTS.md "Rules", Testing); each regex matches exactly one mutant.
exclude_re = [
    # Equivalent while SCHEMA_VERSION is 1 and load accepts only version 1; remove when a second schema version exists.
    'replace Document::schema_version -> u32 with 1$',
    # ARQ-13 invariant check compiled only with debug_assertions: every installed snapshot was validated, so it cannot fire through the public API.
    'replace History::debug_check with \(\)$',
    # Equivalent: when two segments are equally near the point, keeping the first or the last gives the same distance.
    'hittest\.rs:\d+:\d+: replace < with <= in Path::distance_to_perimeter$',
    # interpolate.rs (T4 fix round). Redundant term: `!det.is_finite()` implies `!area.is_finite()` (Hadamard, |a*d| <= |c1||c2|) and a finite `det` with an infinite `area` is degenerate through the last term anyway, so `A || B || C || D` and `A || (B && C) || D` agree on every input.
    'interpolate\.rs:157:48: replace \|\| with && in Parts::decompose$',
    # layout (T4 fix round). Equivalent: the check only asks whether the centre is finite, and `x % 2.0` is finite exactly when `x / 2.0` is (both are non-finite for an infinite sum; NaN cannot arise after the number check).
    'align\.rs:(62|63):37: replace / with % in check_boxes$',
    # Equivalent: at a screen spacing of exactly 6 px the doubling loop runs zero times and gives `unit = step, div = 1, every = 1`, which is what the plain level (and the minor level when subdivisions = 1) gives.
    'grid\.rs:113:27: replace < with <= in level$',
    # Equivalent: two candidates that tie on distance, kind, coordinate and reference differ at most in the sign of a zero (0.0 and -0.0 tie), which the spec treats as the same target (same offset), so replacing one by the other changes nothing.
    'snap\.rs:98:13: replace < with <= in Candidate::beats$',
    # lab.rs (T4 fix round). Equivalent: at `t = EPSILON` both branches of `f` give the same f64 (difference 0), so `>` and `>=` agree everywhere.
    'lab\.rs:41:10: replace > with >= in f$',
    # Equivalent: `chromatic` only gates `dh`, and with `C1 * C2 = 0` the term `dH'` is 0 either way (`2*sqrt(C1*C2)` is 0), so `th` is 0 and `S_H` and `R_T` reach the result only through `th`; a sum or quotient is zero or non-zero in the same cases that matter.
    'lab\.rs:111:24: replace \* with (\+|/) in delta_e2000$',
    # Equivalent: the 360 degree wraps of `dh` differ by 720 degrees in `dh/2` radians' sine argument, and `sin` keeps its value over a full period (difference at rounding level, 8.5e-14).
    'lab\.rs:(116|118):16: replace (-=|\+=) with (\+=|-=) in delta_e2000$',
    # Equivalent: the achromatic arm of `h_bar` feeds only `T`, `S_H` and `R_T`, which reach the result through `th`, and `th` is 0 when `C1 * C2 = 0`.
    'lab\.rs:126:12: replace \+ with (-|\*) in delta_e2000$',
    # irect.rs (T4). Equivalent: `>` and `>=` differ only at `x1 == x0` (`y1 == y0`), where the `>=` arm gives `abs_diff` = 0, the same as the `else` arm. Checked over every `x` in `i32` with `x1 == x0` plus the boundary pairs.
    'irect\.rs:(23|32):20: replace > with >= in IRect::(width|height)$',
    # gafira-text and gafira-raster (spec 013). One line per mutant or per pair on the same expression.
    # Equivalent: the filled split only seeds the bound; a larger seed prunes less and the search still finds the optimum.
    'gafira-text/src/columns\.rs:190:9: replace - with \+ in balance$',
    # Equivalent: a smaller `first` only widens the window of candidates; the search is exhaustive inside the bound.
    'gafira-text/src/columns\.rs:233:58: replace - with \+ in Search<.*>::go$',
    # Equivalent: these change the order in which the candidates are tried, never the set; the best split does not depend on the order.
    'gafira-text/src/columns\.rs:236:(39|46): replace - with (\+|/) in Search<.*>::go$',
    # Equivalent: equal ends are the same split with the same spread, so taking it again changes nothing.
    'gafira-text/src/columns\.rs:251:64: replace > with >= in Search<.*>::offer$',
    # Equivalent: with `last == 0` the minimum is the size already probed, so probing it again gives the same layout.
    'gafira-text/src/fit\.rs:166:22: replace > with >= in fit_box$',
    # Equivalent: with `max_size == min_size` the grid gains a second copy of the same size, and the search gives the same result.
    'gafira-text/src/fit\.rs:200:21: replace > with >= in grid$',
    # Equivalent: at a spacing of 0 the edge size is multiplied by 0, so the smallest or the largest run gives the same fit width.
    'gafira-text/src/layout\.rs:277:30: replace < with <= in layout_with$',
    # Equivalent: an empty range styles no text and contains no byte for `spacing_at`.
    'gafira-text/src/layout\.rs:303:21: replace < with <= in layout_with$',
    # Equivalent: `spacing_em / px != 0` holds exactly when `spacing_em * px != 0` for the finite, positive sizes that reach here.
    'gafira-text/src/layout\.rs:327:37: replace \* with / in layout_with$',
    # Equivalent: parley gives every cluster at least one byte, so `end >= start + 1` and the `max` returns `end` either way.
    'gafira-text/src/layout\.rs:556:54: replace \+ with \* in SourceMap::input_range$',
    # Equivalent: `start - adv <= start + adv` for an advance of 0 or more, and the `max` that follows restores the right edge.
    'gafira-text/src/layout\.rs:680:65: replace \+ with - in align_line$',
    # Equivalent: a room of exactly 0 gives the offset `-l`, which is the hang the line already has.
    'gafira-text/src/layout\.rs:687:25: replace > with >= in align_line$',
    # Equivalent: a line with separators passes the box by at most FIT_TOLERANCE (4e-6 of the width), so the room is always above -1e-4 of the width and these tests all hold.
    'gafira-text/src/layout\.rs:708:58: replace > with >= in align_line$',
    'gafira-text/src/layout\.rs:708:67: replace \* with (\+|/) in align_line$',
    # Equivalent: with one side 0 there are no pixels, the cell sums are 0 and so is the hash.
    'gafira-raster/src/dhash\.rs:(70|89):23: replace \|\| with && in dhash$',
    # Equivalent: Temperatura and Matiz depend only on the ratios of the mean's channels, and `sum * n` has the ratios of `sum / n`.
    'gafira-raster/src/effects/auto_adjust\.rs:115:76: replace / with \* in auto_adjust$',
    # Equivalent: the percentiles asked for are at most 99.5, so the rank never passes `len - 1` and the `min` never binds.
    'gafira-raster/src/effects/auto_adjust\.rs:59:52: replace - with (\+|/) in percentile$',
    # Equivalent: NaN and a radius of 0 or less give `ceil(1.5 r)` NaN or at most 0, which the cast to `usize` makes 0 anyway.
    'gafira-raster/src/effects/blur\.rs:11:27: replace \|\| with && in half_width$',
    # Equivalent: with one side 0 the planes are empty and every loop runs zero times.
    'gafira-raster/src/effects/blur\.rs:62:15: replace \|\| with && in blur_shifted$',
    'gafira-raster/src/effects/shadow\.rs:208:19: replace \|\| with && in <impl Effect for ParallelShadow>::run_cpu$',
    'gafira-raster/src/effects/texture\.rs:270:19: replace \|\| with && in <impl Effect for Texture>::run_cpu$',
    'gafira-raster/src/transitions/guard\.rs:87:20: replace \|\| with && in plan$',
    # Equivalent: the three 5-bit fields do not overlap, so `|` and `^` give the same bin.
    'gafira-raster/src/palette\.rs:28:(38|72): replace \| with \^ in bin_of$',
    # Equivalent: at exactly one half both branches give the colour alone (weight 1, the other 0).
    'gafira-raster/src/transitions/fade\.rs:90:31: replace < with <= in <impl Transition for Fade>::run_cpu$',
    # Equivalent: beyond the softness the formula saturates to the same 0 or 1 (0 <= p <= 1), and there `gap` is never 0.
    'gafira-raster/src/transitions/wipe\.rs:144:38: replace > with (==|>=) in <impl Transition for Wipe>::run_cpu$',
    'gafira-raster/src/transitions/wipe\.rs:145:36: replace > with >= in <impl Transition for Wipe>::run_cpu$',
]
