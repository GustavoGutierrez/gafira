name: CI

# Cost control: the only pull request this repo opens is `develop` -> `main`
# (ADR 0003), and a commit that touches only specs, docs or markdown cannot
# break a Rust gate. Runs are the expensive part of this workflow — four jobs,
# the Windows one takes about twenty minutes — so a push to `develop` costs
# nothing while it has no open PR, and a docs-only change costs nothing at all.
on:
  push:
    branches: [main]
    paths-ignore:
      - "specs/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "specs/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-2022
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Check host matches matrix target
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test "$host" = "${{ matrix.target }}"
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  policy:
    name: policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --check
      - name: CLI has no UI dependencies (ARQ-07)
        run: |
          tree=$(cargo tree -p gafira-cli --no-default-features -e normal,build --target all)
          if grep -Eq 'gafira-ui|eframe|winit|wgpu' <<<"$tree"; then
            echo "gafira-cli must not depend on UI crates" >&2
            exit 1
          fi
      - name: Domain crates forbid unsafe code
        run: |
          status=0
          for f in crates/*/src/lib.rs apps/*/src/main.rs; do
            [ -e "$f" ] || continue
            grep -Eq '^#!\[forbid\(unsafe_code\)\]' "$f" || { echo "missing forbid(unsafe_code): $f" >&2; status=1; }
          done
          exit "$status"
      - name: Domain crates respect the layer table (V5)
        run: |
          set -euo pipefail
          # crate  allowed-internal-deps ("-" = none). Add a row per domain crate; keep the step unchanged.
          table='
          gafira-geom  -
          gafira-color -
          gafira-time  -
          gafira-doc   gafira-geom gafira-color gafira-time
          gafira-edit  gafira-geom gafira-color gafira-doc gafira-time
          gafira-testkit gafira-geom gafira-color gafira-doc gafira-edit gafira-time
          gafira-pathops gafira-geom gafira-color gafira-doc gafira-time
          gafira-layout gafira-geom gafira-color gafira-doc gafira-time
          gafira-anim   gafira-time gafira-geom gafira-color
          gafira-text    gafira-geom gafira-color gafira-doc gafira-pathops gafira-time
          gafira-raster  gafira-geom gafira-color gafira-doc gafira-time
          gafira-audio   gafira-geom gafira-color gafira-doc gafira-time
          gafira-segment gafira-geom gafira-color gafira-doc gafira-raster gafira-time
          gafira-ports   gafira-geom gafira-color gafira-doc gafira-time gafira-raster
          gafira-render  gafira-ports gafira-doc gafira-geom gafira-color gafira-raster gafira-time gafira-anim gafira-text gafira-pathops
          gafira-media   gafira-ports gafira-doc gafira-raster gafira-time gafira-geom gafira-color
          gafira-render-cpu gafira-ports gafira-doc gafira-geom gafira-color gafira-raster gafira-time
          gafira-engine gafira-ports gafira-doc gafira-edit gafira-geom gafira-color gafira-time gafira-raster
          gafira-theme  gafira-doc gafira-geom gafira-color gafira-time
          '
          forbidden='egui|eframe|winit|wgpu|tokio|mio|socket2|reqwest|ureq'
          status=0
          listed=$(awk 'NF{print $1}' <<<"$table")
          for c in crates/*/clippy.toml; do # domain crates are the crates with a clippy.toml copy (V12)
            name=$(basename "$(dirname "$c")")
            grep -qx "$name" <<<"$listed" || { echo "::error::$name has clippy.toml but no V5 row" >&2; status=1; }
          done
          while read -r crate allowed; do
            [ -n "$crate" ] || continue
            tree=$(cargo tree -p "$crate" -e normal,build --target all --prefix none -f '{p}' </dev/null)
            grep -q "^$crate v" <<<"$tree" || { echo "::error::empty cargo tree for $crate" >&2; status=1; continue; }
            for dep in $(grep -Eo '^gafira-[a-z0-9-]+' <<<"$tree" | sort -u); do
              [ "$dep" = "$crate" ] && continue
              case " $allowed " in *" $dep "*) ;; *) echo "::error::$crate must not depend on $dep" >&2; status=1;; esac
            done
            if bad=$(grep -E "^($forbidden)" <<<"$tree"); then echo "::error::$crate: forbidden $bad" >&2; status=1; fi
          done <<<"$table"
          exit "$status"
      - name: Layer-4 adapters do not depend on the engine (ARQ-06)
        run: |
          set -euo pipefail
          # Adapters that do I/O have no domain clippy.toml and so no V5 row; ARQ-06 still holds for them:
          # no gafira-engine, gafira-render or gafira-media in their normal or build tree (dev-dependencies are not edges).
          status=0
          for crate in gafira-assets gafira-format gafira-platform gafira-io-image; do
            tree=$(cargo tree -p "$crate" -e normal,build --target all --prefix none -f '{p}' </dev/null)
            grep -q "^$crate v" <<<"$tree" || { echo "::error::empty cargo tree for $crate" >&2; status=1; continue; }
            if bad=$(grep -E '^(gafira-(engine|render|media|ui)|egui|eframe|winit|wgpu) v' <<<"$tree"); then
              echo "::error::$crate: forbidden $bad (ARQ-06)" >&2; status=1
            fi
          done
          exit "$status"
      - name: Domain clippy.toml copies are in sync (V12)
        run: |
          set -euo pipefail
          canon=crates/gafira-geom/clippy.toml
          # Only the disallowed-types array counts: from its key line to its closing bracket.
          types=$(awk '/^disallowed-types[[:space:]]*=/{on=1} on{print} on && /^\]/{exit}' "$canon")
          [ -n "$types" ] || { echo "::error::$canon has no disallowed-types array" >&2; exit 1; }
          for t in HashMap HashSet; do
            grep -qE "^[[:space:]]*\{ path = \"std::collections::$t\"" <<<"$types" \
              || { echo "::error::$canon lacks the std::collections::$t ban under disallowed-types" >&2; exit 1; }
          done
          # The required copies come from the V5 table (the one list of domain crates): read its rows from this file.
          table=$(awk -v q="'" '$0 ~ "^ *table=" q "$"{on=1; next} on && $0 ~ "^ *" q "$"{exit} on{print}' .github/workflows/ci.yml)
          crates=$(awk 'NF{print $1}' <<<"$table")
          [ -n "$crates" ] || { echo "::error::no V5 table rows found in .github/workflows/ci.yml" >&2; exit 1; }
          status=0
          for name in $crates; do
            if [ "$name" = gafira-testkit ]; then
              echo "gafira-testkit: exempt, a support crate without clippy.toml (design Q10)"
              continue
            fi
            c=crates/$name/clippy.toml
            [ -f "$c" ] || { echo "::error::$name is in the V5 table but has no $c" >&2; status=1; continue; }
            [ "$c" = "$canon" ] || cmp -s "$canon" "$c" || { echo "::error::$name: clippy.toml differs from $canon" >&2; status=1; }
          done
          exit "$status"
      - name: Layers 0-2 know no language (ARQ-107)
        run: |
          set -euo pipefail
          # Until `check-layers` exists (ARQ-107), per crate of layers 0-2: no i18n or ICU formatting crate in its
          # transitive normal tree, and no `Locale` in its files. icu_segmenter stays allowed in gafira-text.
          banned='gafira-i18n|icu_decimal|icu_datetime|icu_plurals'
          # The crate list comes from the V5 table (the one list of domain crates), as in V12.
          table=$(awk -v q="'" '$0 ~ "^ *table=" q "$"{on=1; next} on && $0 ~ "^ *" q "$"{exit} on{print}' .github/workflows/ci.yml)
          crates=$(awk 'NF{print $1}' <<<"$table")
          [ -n "$crates" ] || { echo "::error::no V5 table rows found in .github/workflows/ci.yml" >&2; exit 1; }
          status=0
          for name in $crates; do
            if [ "$name" = gafira-testkit ]; then
              echo "gafira-testkit: exempt, dev-only support and not a layer 0-2 crate"
              continue
            fi
            tree=$(cargo tree -p "$name" -e normal --target all --prefix none -f '{p}' </dev/null)
            grep -q "^$name v" <<<"$tree" || { echo "::error::empty cargo tree for $name" >&2; status=1; continue; }
            if bad=$(grep -E "^($banned) v" <<<"$tree"); then echo "::error::$name depends on $bad (ARQ-107)" >&2; status=1; fi
            [ -d "crates/$name/src" ] || { echo "::error::crates/$name/src not found" >&2; status=1; continue; }
            # The search is ARQ-107's "layers 0-2 know no language". Layer 3 resolves the locale by
            # design: gafira-ports defines the type (ADR 0013) and ADR 0016 makes layer 3 take its
            # I/O, its clock and its threads through ports, so the crates below keep only their
            # dependency check above; every other crate in the table must stay free of the type.
            case "$name" in
              gafira-ports|gafira-engine)
                echo "$name: layer 3, exempt from the Locale search"
                continue ;;
            esac
            rc=0; hits=$(grep -rn 'Locale' "crates/$name") || rc=$?
            case "$rc" in
              0) echo "::error::$name mentions Locale (ARQ-107):" >&2; echo "$hits" >&2; status=1 ;;
              1) ;;
              *) echo "::error::grep failed on crates/$name (rc=$rc)" >&2; status=1 ;;
            esac
          done
          exit "$status"
      - name: gafira-i18n depends only on ports, doc and ICU4X (ARQ-107)
        run: |
          set -euo pipefail
          # gafira-i18n compiles assets/i18n/*.toml in its build script, so it has no domain clippy.toml
          # (which bans std::fs) and no V5 row; this step checks its own row of 02 §2.1 instead.
          direct=$(cargo tree -p gafira-i18n -e normal --target all --depth 1 --prefix none -f '{p}' </dev/null | tail -n +2 | awk '{print $1}' | sort -u)
          [ -n "$direct" ] || { echo "::error::empty cargo tree for gafira-i18n" >&2; exit 1; }
          status=0
          for dep in $direct; do
            case "$dep" in
              gafira-ports|gafira-doc|icu_*) ;;
              *) echo "::error::gafira-i18n must not depend on $dep (ARQ-107)" >&2; status=1 ;;
            esac
          done
          tree=$(cargo tree -p gafira-i18n -e normal,build --target all --prefix none -f '{p}' </dev/null)
          if bad=$(grep -E '^(gafira-(engine|ui|platform)|egui|eframe|winit|wgpu) v' <<<"$tree"); then
            echo "::error::gafira-i18n: forbidden $bad" >&2; status=1
          fi
          exit "$status"
      - name: EditToken only in the edit crates (V13)
        run: |
          set -euo pipefail
          allowed='^crates/(gafira-doc|gafira-edit|gafira-testkit)/'
          rc=0; hits=$(git grep --untracked -nE 'EditToken|__new_for_gafira_edit_only' -- '*.rs') || rc=$?
          [ "$rc" -le 1 ] || { echo "::error::git grep failed (rc=$rc)" >&2; exit 1; }
          # Positive control: the repo-wide search must see the definition, otherwise it searched the wrong place.
          grep -qE '^crates/gafira-doc/src/[a-z_/]+\.rs:[0-9]+:pub struct EditToken \{' <<<"$hits" \
            || { echo "::error::positive control failed: EditToken definition not found" >&2; exit 1; }
          rc=0; bad=$(grep -vE "$allowed" <<<"$hits") || rc=$?
          case "$rc" in
            0) echo "::error::EditToken outside allowed crates:" >&2; echo "$bad" >&2; exit 1 ;;
            1) ;;
            *) echo "::error::filter grep failed (rc=$rc)" >&2; exit 1 ;;
          esac
          # Public re-exports from gafira-edit. Records are split on ';', so a multi-line
          # `pub use gafira_doc::{\n EditToken,\n};` is one record. A plain directory pathspec is silent when the dir does not exist
          # (a glob pathspec is not: git 2.34 prints "could not open directory" to stderr). `|| true`: grep exits 1 on no match.
          files=$(git ls-files --cached --others --exclude-standard -- crates/gafira-edit | grep '\.rs$' || true)
          status=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            out=$(awk 'BEGIN{RS=";"} /pub[[:space:]]+(use|type)[^;]*EditToken/ || /pub[[:space:]]+use[^;]*\*/ {print FILENAME ": " $0}' "$f")
            [ -z "$out" ] || { echo "::error::gafira-edit must not publicly re-export EditToken:" >&2; echo "$out" >&2; status=1; }
          done <<<"$files"
          exit "$status"
      - name: Every core command has a property test (V14)
        run: |
          set -euo pipefail
          props=crates/gafira-edit/tests/prop_commands.rs
          # A core command is the type of an `impl [path::]Command for T` under crates/gafira-edit/src. Headers are read as
          # text with line breaks folded, so generics, a path before the trait and multi-line headers are seen. Left out:
          # blocks under #[cfg(test)] (brace counted) and the files such a block declares (`#[path = ".."] mod x;`, `mod x;`).
          # Known limits: braces inside strings or comments confuse the block skip, macro-generated impls are invisible, and
          # a type name that only appears in a comment of the property file counts as covered.
          # A pathspec that matches nothing lists nothing (V13), so a wrong working directory ends at the positive control.
          rc=0; listed=$(git ls-files --cached --others --exclude-standard -- crates/gafira-edit/src) || rc=$?
          [ "$rc" -eq 0 ] || { echo "::error::git ls-files failed (rc=$rc)" >&2; exit 1; }
          sources=$(grep -E '\.rs$' <<<"$listed" || true)
          tests=""
          for f in $sources; do
            rc=0; out=$(awk '/^[[:space:]]*#\[cfg\(test\)\]/{p=1;next}
              p && /#\[path[[:space:]]*=/{match($0,/"[^"]+"/);n=substr($0,RSTART+1,RLENGTH-2);sub(/^.*\//,"",n);print n;next}
              p && /^[[:space:]]*(pub[[:space:]]+)?mod[[:space:]]+[A-Za-z0-9_]+[[:space:]]*;/{n=$0;sub(/^.*mod[[:space:]]+/,"",n);sub(/[[:space:]]*;.*/,"",n);print n ".rs";p=0;next}
              p && !/^[[:space:]]*#\[/{p=0}' "$f") || rc=$?
            [ "$rc" -eq 0 ] || { echo "::error::awk failed on $f (rc=$rc)" >&2; exit 1; }
            tests+="$out"$'\n'
          done
          types=""; defs=""
          for f in $sources; do
            grep -qxF "$(basename "$f")" <<<"$tests" && continue
            rc=0; text=$(awk '/^[[:space:]]*\/\//{next}
              /^[[:space:]]*#\[cfg\(test\)\]/{k=1;next}
              k==1 && /^[[:space:]]*#\[/{next}
              k==1{k=2;d=0}
              k==2{o=gsub(/\{/,"{");c=gsub(/\}/,"}");d+=o-c;if(d<=0&&(o>0||/;[[:space:]]*$/))k=0;next}
              {printf "%s ",$0}' "$f") || rc=$?
            [ "$rc" -eq 0 ] || { echo "::error::awk failed on $f (rc=$rc)" >&2; exit 1; }
            rc=0; headers=$(grep -Eo '(^|[^A-Za-z0-9_])impl[^{;]*\{' <<<"$text") || rc=$?
            case "$rc" in 0) ;; 1) headers="" ;; *) echo "::error::grep failed on $f (rc=$rc)" >&2; exit 1 ;; esac
            while IFS= read -r h; do
              [ -n "$h" ] || continue
              t=$(sed -nE 's/^.*impl[[:space:]]*(<.*>)?[[:space:]]*([A-Za-z0-9_]+::)*Command[[:space:]]+for[[:space:]]+([^{]*)\{$/\3/p' <<<"$h")
              [ -n "$t" ] || continue
              t=$(sed -E 's/[[:space:]]+where([[:space:]].*)?$//; s/[[:space:]]+$//' <<<"$t")
              grep -Eq '^[A-Za-z_][A-Za-z0-9_]*(<.*>)?$' <<<"$t" \
                || { echo "::error::V14 cannot name the type of 'impl Command for $t' in $f; use a plain local type" >&2; exit 1; }
              types+="${t%%<*}"$'\n'
            done <<<"$headers"
            rc=0; found=$(grep -Eo '(struct|enum|union)[[:space:]]+[A-Za-z_][A-Za-z0-9_]*' "$f") || rc=$?
            case "$rc" in 0) defs+="$(sed -E 's/^[a-z]+[[:space:]]+//' <<<"$found")"$'\n' ;; 1) ;; *) echo "::error::grep failed on $f (rc=$rc)" >&2; exit 1 ;; esac
          done
          # Positive control: at least one implementation must be found.
          [ -n "$types" ] || { echo "::error::positive control failed: no impl Command found under crates/gafira-edit/src" >&2; exit 1; }
          [ -f "$props" ] || { echo "::error::$props not found" >&2; exit 1; }
          missing=""
          for t in $(sort -u <<<"$types"); do
            grep -qxF "$t" <<<"$defs" || missing+=" $t(not a type defined under src)"
            rc=0; grep -Eqw -- "$t" "$props" || rc=$?
            case "$rc" in
              0) ;;
              1) missing+=" $t" ;;
              *) echo "::error::grep failed on $props (rc=$rc)" >&2; exit 1 ;;
            esac
          done
          [ -z "$missing" ] || { echo "::error::core commands without a property test in $props:$missing" >&2; exit 1; }
      - name: Testkit ports feature compiles (ADR 0013)
        run: |
          set -euo pipefail
          # The `ports` feature of the testkit is off by default (ADR 0013, decision 4), so the
          # default suite of the `test` matrix compiles neither the nine port doubles nor the
          # `#[cfg(feature = "ports")]` test of tests/ports_feature.rs. This job runs on a single
          # target, so the step checks the host before compiling: the feature is compiled here on
          # Linux (x86_64-unknown-linux-gnu, the Linux entry of the `test` matrix). The three
          # product targets (Windows, Linux, macOS) are covered by that matrix through the default
          # suite, whose tree carries neither gafira-ports nor gafira-raster.
          host="$(rustc -vV | sed -n 's/^host: //p')"
          [ "$host" = x86_64-unknown-linux-gnu ] || { echo "::error::unexpected host: $host (expected x86_64-unknown-linux-gnu)" >&2; exit 1; }
          cargo clippy -p gafira-testkit --all-targets --features ports --locked -- -D warnings
          cargo test -p gafira-testkit --features ports --locked
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
