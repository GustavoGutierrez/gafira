name: Release

# The binaries of a version (spec 090). A `v*` tag builds Linux and Windows and
# publishes them in its GitHub release. The gates already ran on the pull
# request the tag comes from (ci.yml), so nothing is tested twice here: only the
# packages themselves are checked.
#
# By hand, it builds without publishing. On `develop` that also leaves the cache
# the next tag starts from: a cache saved by a tag is of that tag alone. macOS
# minutes cost ten times those of Linux, so it is built only when asked for; run
# on a tag, it is added to the release of that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      macos:
        description: "Build macOS too"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    name: Linux (.deb, AppImage)
    # The oldest glibc the .deb promises (2.35).
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The tag is the version of Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME, version $version"; exit 1; }
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - name: appimagetool
        run: |
          dir=$RUNNER_TEMP/appimage
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL --retry 3 -o "$dir/runtime" https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          sha256sum -c <<EOF
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $dir/appimagetool
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $dir/runtime
          EOF
          chmod +x "$dir/appimagetool"
          echo "APPIMAGETOOL=$dir/appimagetool" >>"$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$dir/runtime" >>"$GITHUB_ENV"
      - name: Build
        run: packaging/linux/build-packages.sh
      - name: Check the packages
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ "$(target/release/gafira --version)" = "gafira $version" ]
          dpkg-deb -c dist/*.deb >deb.txt
          for path in usr/bin/gafira usr/share/mime/packages/gafira.xml usr/share/applications/gafira.desktop \
            usr/share/icons/hicolor/256x256/mimetypes/application-vnd.gafira.project+zip.png; do
            grep -qF "./$path" deb.txt || { echo "::error::the .deb has no $path"; exit 1; }
          done
          # The releases of GitHub turn a ~ of a name into a dot.
          for deb in dist/*~*.deb; do mv "$deb" "${deb/\~/-}"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  windows:
    name: Windows (installer, .zip)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - name: NSIS
        run: |
          if [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis --yes --no-progress
          fi
      - name: Build
        run: packaging/windows/build.sh
      - name: Install, check the .gaf, .gafkit and .gafpack files and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $setup = (Get-Item dist/Gafira-*-Setup-x64.exe).FullName
          Start-Process $setup -ArgumentList '/S' -Wait
          $dir = "$env:ProgramFiles\Gafira"
          $said = & "$dir\Gafira.exe" --version | Out-String
          if ($said.Trim() -ne "gafira $version") { throw "the program says '$said'" }
          $classes = 'HKLM:\Software\Classes'
          $class = (Get-ItemProperty "$classes\.gaf").'(default)'
          $icon = (Get-ItemProperty "$classes\$class\DefaultIcon").'(default)'
          $open = (Get-ItemProperty "$classes\$class\shell\open\command").'(default)'
          if ($class -ne 'Gafira.Project') { throw ".gaf is '$class'" }
          if ($icon -ne "$dir\gafira-project.ico,0" -or -not (Test-Path "$dir\gafira-project.ico")) { throw "icon '$icon'" }
          if ($open -ne "`"$dir\Gafira.exe`" `"%1`"") { throw "command '$open'" }
          $kit = (Get-ItemProperty "$classes\.gafkit").'(default)'
          $kitIcon = (Get-ItemProperty "$classes\$kit\DefaultIcon").'(default)'
          if ($kit -ne 'Gafira.BrandKit') { throw ".gafkit is '$kit'" }
          if ($kitIcon -ne "$dir\gafira-brandkit.ico,0" -or -not (Test-Path "$dir\gafira-brandkit.ico")) { throw "kit icon '$kitIcon'" }
          $pack = (Get-ItemProperty "$classes\.gafpack").'(default)'
          $packIcon = (Get-ItemProperty "$classes\$pack\DefaultIcon").'(default)'
          if ($pack -ne 'Gafira.AssetPackage') { throw ".gafpack is '$pack'" }
          if ($packIcon -ne "$dir\gafira-gafpack.ico,0" -or -not (Test-Path "$dir\gafira-gafpack.ico")) { throw "pack icon '$packIcon'" }
          Start-Process "$dir\Uninstall.exe" -ArgumentList '/S' -Wait
          # The uninstaller goes on from a copy of itself.
          foreach ($i in 1..30) { if (-not (Test-Path "$dir\Gafira.exe")) { break }; Start-Sleep 1 }
          Start-Sleep 2
          if ((Test-Path "$dir\Gafira.exe") -or (Test-Path "$classes\$class") -or (Test-Path "$classes\$kit") -or (Test-Path "$classes\$pack")) { throw 'it was not uninstalled' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: |
            dist/*-Setup-x64.exe
            dist/*-windows-x64.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  macos:
    name: macOS (.dmg)
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build
        run: packaging/macos/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    name: Publish
    needs: [linux, windows, macos]
    # A macOS that was not asked for, or failed, does not stop the other two.
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v')
      && needs.linux.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: files
          merge-multiple: true
      - name: Publish
        run: |
          version=${GITHUB_REF_NAME#v}
          (cd files && sha256sum -- * >SHA256SUMS && cat SHA256SUMS)
          # The entry of the version in the changelog.
          awk -v head="## [$version]" 'index($0, head) == 1 {on = 1; next} /^## \[/ {on = 0} on' CHANGELOG.md >notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no [$version]"; exit 1; }
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" files/* --clobber
          else
            flags=()
            case "$version" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" files/* --verify-tag \
              --title "Gafira $version" --notes-file notes.md "${flags[@]}"
          fi
