[package]
name = "gafira-photos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# D-111: the network is opt-in and only the binary turns it on (ARQ-08).
online = ["dep:ureq"]

[dependencies]
gafira-ports.workspace = true
serde.workspace = true
serde_json.workspace = true
# D-111: a small blocking HTTP client (MIT OR Apache-2.0) with rustls on
# ring and the system's certificates, without the webpki-roots bundle.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier", "gzip"], optional = true }

[lints]
workspace = true
