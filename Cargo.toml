[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0-beta.2"
edition = "2024"
rust-version = "1.93"
license = "LicenseRef-Gafira-Proprietary"
publish = false

[workspace.dependencies]
gafira-geom = { path = "crates/gafira-geom" }
gafira-color = { path = "crates/gafira-color" }
gafira-doc = { path = "crates/gafira-doc" }
gafira-edit = { path = "crates/gafira-edit" }
gafira-time = { path = "crates/gafira-time" }
gafira-anim = { path = "crates/gafira-anim" }
gafira-testkit = { path = "crates/gafira-testkit" }
gafira-pathops = { path = "crates/gafira-pathops" }
gafira-layout = { path = "crates/gafira-layout" }
gafira-text = { path = "crates/gafira-text" }
gafira-raster = { path = "crates/gafira-raster" }
gafira-audio = { path = "crates/gafira-audio" }
gafira-segment = { path = "crates/gafira-segment" }
gafira-ports = { path = "crates/gafira-ports" }
gafira-render = { path = "crates/gafira-render" }
gafira-media = { path = "crates/gafira-media" }
gafira-render-cpu = { path = "crates/gafira-render-cpu" }
gafira-engine = { path = "crates/gafira-engine" }
gafira-theme = { path = "crates/gafira-theme" }
gafira-ui = { path = "crates/gafira-ui" }
gafira-platform = { path = "crates/gafira-platform" }
gafira-i18n = { path = "crates/gafira-i18n" }
blake3 = "1"
crossbeam-channel = "0.5"
kurbo = { version = "0.13", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
trybuild = "1"
png = "0.18"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
parley = { version = "0.12", default-features = false, features = ["std"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
rayon = "1"
assert_no_alloc = "1.1"
# ICU4X for gafira-i18n (02 §14.8), with its compiled CLDR data; `toml` is a build dependency only.
icu_locale_core = "2.4"
icu_plurals = "2.4"
icu_decimal = "2.4"
toml = "1"

eframe = { version = "0.33", default-features = false, features = ["glow", "x11", "wayland", "accesskit"] }
egui = { version = "0.33", default-features = false }
getrandom = "0.3"
egui_extras = { version = "0.33", default-features = false, features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2

# Used by cargo-mutants (`profile = "mutants"` in .cargo/mutants.toml): no debug info, faster builds per mutant.
[profile.mutants]
inherits = "test"
debug = "none"

# The segmentation gate runs 4000x3000 images through the whole pipeline in tests.
[profile.dev.package.gafira-segment]
opt-level = 2

[profile.dev.package.gafira-testkit]
opt-level = 2
