[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.93"
license = "LicenseRef-Gafira-Proprietary"
publish = false

[workspace.dependencies]
gafira-geom = { path = "crates/gafira-geom" }
gafira-color = { path = "crates/gafira-color" }
gafira-doc = { path = "crates/gafira-doc" }
gafira-edit = { path = "crates/gafira-edit" }
gafira-time = { path = "crates/gafira-time" }
gafira-anim = { path = "crates/gafira-anim" }
gafira-testkit = { path = "crates/gafira-testkit" }
gafira-pathops = { path = "crates/gafira-pathops" }
gafira-layout = { path = "crates/gafira-layout" }
kurbo = { version = "0.13", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
trybuild = "1"
png = "0.18"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2

# Used by cargo-mutants (`profile = "mutants"` in .cargo/mutants.toml): no debug info, faster builds per mutant.
[profile.mutants]
inherits = "test"
debug = "none"
