[workspace]
resolver = "3"
members = ["apps/gafira-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "LicenseRef-Gafira-Proprietary"
publish = false

[workspace.dependencies]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2
