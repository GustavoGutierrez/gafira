<!doctype html>
<!--
  The share image of the website (Open Graph / Twitter), 1200 × 630.
  Open it in a browser at 1200 × 630 with ?lang=es or ?lang=en and save a
  screenshot as src/assets/og/og-<lang>.png (see website/README.md).
  Brand: canvas background, ink text, coral and mint panels, the logo and the
  editor screenshot of that language.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Manrope Variable';
        src: url('../node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2') format('woff2');
        font-weight: 200 800;
      }
      @font-face {
        font-family: 'Inter Variable';
        src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: #fafaf7;
        color: #18243b;
        font-family: 'Inter Variable', sans-serif;
      }
      .glow {
        position: absolute; inset: 0;
        background:
          radial-gradient(45% 60% at 8% 10%, rgb(63 191 169 / 0.18), transparent 70%),
          radial-gradient(40% 55% at 95% 95%, rgb(255 107 87 / 0.16), transparent 70%);
      }
      .text { position: absolute; left: 72px; top: 72px; width: 480px; }
      .logo { width: 220px; display: block; }
      h1 {
        margin-top: 56px;
        font-family: 'Manrope Variable', sans-serif;
        font-weight: 800;
        font-size: 62px;
        line-height: 1.05;
        letter-spacing: -0.035em;
      }
      p {
        margin-top: 24px;
        font-size: 24px;
        line-height: 1.45;
        color: #46526b;
      }
      .systems {
        position: absolute; left: 72px; bottom: 64px;
        display: flex; gap: 10px;
      }
      .systems span {
        padding: 8px 16px;
        border-radius: 999px;
        background: #18243b;
        color: #fff;
        font-size: 17px;
        font-weight: 600;
      }
      .stage { position: absolute; left: 600px; top: 96px; width: 700px; height: 470px; }
      .panel { position: absolute; border-radius: 20px; }
      .coral { width: 260px; height: 200px; left: -26px; top: -30px; background: #ff6b57; transform: rotate(-5deg); }
      .mint { width: 220px; height: 180px; left: 360px; bottom: -36px; background: #3fbfa9; transform: rotate(5deg); }
      .window {
        position: absolute; inset: 0;
        border-radius: 18px; overflow: hidden;
        background: #18243b;
        box-shadow: 0 30px 60px rgb(24 36 59 / 0.22), 0 10px 20px rgb(24 36 59 / 0.1);
      }
      .bar { display: flex; gap: 8px; padding: 12px 16px; }
      .bar i { width: 11px; height: 11px; border-radius: 50%; background: rgb(231 234 242 / 0.3); }
      .window img { display: block; width: 760px; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="text">
      <img class="logo" src="../public/logo.svg" alt="" />
      <h1 data-text="title"></h1>
      <p data-text="lead"></p>
    </div>
    <div class="systems"><span>Windows</span><span>macOS</span><span>Linux</span></div>
    <div class="stage">
      <div class="panel coral"></div>
      <div class="panel mint"></div>
      <div class="window">
        <div class="bar"><i></i><i></i><i></i></div>
        <img data-shot alt="" />
      </div>
    </div>
    <script>
      const copy = {
        es: { title: 'Haz visibles tus ideas.', lead: 'Programa de diseño gráfico para todas las personas y creadores de contenido.' },
        en: { title: 'Bring your ideas to life.', lead: 'Graphic design software for everyone and for content creators.' },
      };
      const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'es';
      document.documentElement.lang = lang;
      for (const el of document.querySelectorAll('[data-text]')) el.textContent = copy[lang][el.dataset.text];
      document.querySelector('[data-shot]').src = `../src/assets/screens/editor-${lang}.png`;
    </script>
  </body>
</html>
