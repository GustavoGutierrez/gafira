# Licence register for the files of `assets/` (ARQ-75).
#
# This file is partial until `xtask` exists. It has two mandatory entries from
# its first commit: the test fonts (ARQ-115) and `assets/splash_screen.jpg` (D-09).
# `crates/gafira-testkit/tests/licences.rs` checks both.
#
# Every entry has the fields of 05 FV-38 (path, hash BLAKE3, license, autoría, origin,
# exige atribución, modificado); `hash` is computed from the file, not typed.
# Font entries add upstream, commit and subset command; `autoría` is name ID 0 of the subset.
# Splash `modificado` is false because D-09 records no edit; confirm with the owner.
#
# Each entry is one `[[asset]]` table of `key = "value"` lines.

