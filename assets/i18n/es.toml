about = "Acerca de"
fonts = "Tipografías incluidas"
font_license = "Licencia SIL Open Font"

[settings.appearance]
title = "Apariencia"
light = "Claro"
dark = "Oscuro"
system = "Sistema"

[settings.language]
help = "Con Sistema, Gafira usa español si tu equipo está en cualquier variante de español, e inglés en los demás casos. El cambio se aplica al momento."
title = "Idioma"
system = "Sistema"
system_now = "Sistema · ahora: {language} ({tag})"
es = "Español"
en = "English"

[export]
done = "Tu diseño está listo para compartir"
title = "Exportar"
format = "Formato"
png = "PNG · página actual"
pdf = "PDF · todas las páginas"
scale = "Escala"
