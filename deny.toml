# cargo-deny policy (ARQ-70, ARQ-71). Allowlist amendments for transitive
# dependencies must use a per-crate [[licenses.exceptions]] entry with a written rationale.

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[advisories]
# Needs network (advisory database); runs in CI, may be skipped locally.
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "MIT-0",
    "0BSD",
]
confidence-threshold = 0.93
# The allowlist is policy for future dependencies; unused entries are not an error.
unused-allowed-license = "allow"
# The exception below is for a dev-only dependency, which cargo-deny never matches (layer-2 design L9, P1).
unused-license-exception = "allow"

# assert_no_alloc (BSD-1-Clause, not in the allowlist) is a dev-dependency of gafira-audio and gafira-testkit, used as the
# allocation guard of ARQ-23. Owner exception, layer-2 design E2/S20; it never ships in a product binary.
[[licenses.exceptions]]
allow = ["BSD-1-Clause"]
crate = "assert_no_alloc"

[licenses.private]
# Workspace crates use LicenseRef-Gafira-Proprietary and are never published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Private path dependencies carry no version requirement.
allow-wildcard-paths = true
deny = [
    { name = "ffmpeg-sidecar" },
    { name = "ffmpeg-next" },
    { name = "ffmpeg-sys-next" },
    { name = "symphonia" },
    { name = "imbl" },
    { name = "im" },
    { name = "rpds" },
    { name = "gstreamer" },
    { name = "openssl-sys" },
    # Encoders with patents or LGPL (crate names to be verified when adopted).
    { name = "openh264" },
    { name = "x264" },
    { name = "mp3lame-encoder" },
    # GNU gettext (LGPL/GPL) and its wrapper are not used for localization.
    { name = "gettext-rs" },
    { name = "gettext-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
